<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a PokerFection table</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <!--
    The invite link's page: join.html?code=K7M2Q&server=192.168.1.20:47474&server=203.0.113.7:47475
    (the same query as the app's own pokerfection://join link). A secure
    page can't play against a home host (browsers block it), so this one
    sends the player where they can: the app, or the host's own web version
    over http on the same Wi-Fi or from elsewhere. It loads instantly (no
    Flutter), in English, Spanish or Chinese.
  -->
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0F12;
      color: #E8F0EA;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: min(420px, calc(100% - 32px)); text-align: center; padding: 24px 0; }
    h1 { font-size: 20px; font-weight: 600; margin: 0; }
    .code { font-size: 44px; font-weight: 800; letter-spacing: 8px; margin: 8px 0 20px; }
    a.button {
      display: block;
      padding: 14px 16px;
      margin: 10px 0;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
    }
    a.app { background: #2E8B57; color: #FFFFFF; }
    a.web { background: #16211B; color: #E8F0EA; border: 1px solid #2E8B57; }
    .small { display: block; font-weight: 400; font-size: 13px; color: #9DB0A4; margin-top: 2px; }
    .hint { color: #9DB0A4; font-size: 13px; line-height: 1.5; margin-top: 18px; }
    a.plain { color: #81C784; }
  </style>
</head>
<body>
  <main id="page"></main>
  <script>
    (function () {
      var text = {
        en: {
          title: 'Join the table',
          app: 'Open in the PokerFection app',
          wifi: 'Play in this browser',
          wifiWhere: 'On the same Wi-Fi as the host',
          internet: 'Play in this browser',
          internetWhere: 'From anywhere else',
          hint: 'Have the app? Open it from the first button, or type the room code in Play > Multiplayer. ' +
            'In a browser, pick where you are: on the same Wi-Fi as the host, or anywhere else.',
          none: 'There is no room in this link.',
          game: 'Go to PokerFection'
        },
        es: {
          title: 'Únete a la mesa',
          app: 'Abrir en la app PokerFection',
          wifi: 'Jugar en este navegador',
          wifiWhere: 'En el mismo Wi-Fi que el anfitrión',
          internet: 'Jugar en este navegador',
          internetWhere: 'Desde cualquier otro lugar',
          hint: '¿Tienes la app? Ábrela con el primer botón, o escribe el código de sala en Jugar > Multijugador. ' +
            'En un navegador, elige dónde estás: en el mismo Wi-Fi que el anfitrión o en otro lugar.',
          none: 'Este enlace no tiene sala.',
          game: 'Ir a PokerFection'
        },
        zh: {
          title: '加入牌桌',
          app: '在 PokerFection 应用中打开',
          wifi: '在此浏览器中玩',
          wifiWhere: '与房主在同一个 Wi-Fi',
          internet: '在此浏览器中玩',
          internetWhere: '在其他任何地方',
          hint: '有应用？用第一个按钮打开，或在 开始 > 多人 中输入房间号。在浏览器中，请按你所在的位置选择：与房主同一个 Wi-Fi，或其他地方。',
          none: '这个链接里没有房间。',
          game: '前往 PokerFection'
        }
      };
      var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
      var t = text[lang] || text.en;
      document.documentElement.lang = text[lang] ? lang : 'en';
      var page = document.getElementById('page');

      function add(tag, className, content, href) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (content) node.textContent = content;
        if (href) node.href = href;
        page.appendChild(node);
        return node;
      }

      var params = new URLSearchParams(location.search);
      var code = (params.get('code') || '').trim().toUpperCase();
      if (!/^[A-HJKMNP-Z2-9]{5}$/.test(code)) {
        add('p', 'hint', t.none);
        add('a', 'plain', t.game, './');
        return;
      }

      // The host's game servers, as the app's link writes them: "address:port"
      // (or a whole ws:// address). Its web version answers at the same place.
      function server(value) {
        try {
          var url = new URL(value.indexOf('://') < 0 ? 'ws://' + value + '/ws' : value);
          return url.protocol === 'ws:' && url.hostname ? { host: url.hostname, port: url.port || '80' } : null;
        } catch (e) {
          return null;
        }
      }
      function local(host) {
        return /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|169\.254\.)/.test(host);
      }

      add('h1', null, t.title);
      add('div', 'code', code);
      add('a', 'button app', t.app, 'pokerfection://join' + location.search);
      params.getAll('server').map(server).filter(Boolean).forEach(function (s) {
        var near = local(s.host);
        var button = add('a', 'button web', near ? t.wifi : t.internet,
          'http://' + s.host + ':' + s.port + '/?code=' + code);
        var where = document.createElement('span');
        where.className = 'small';
        where.textContent = near ? t.wifiWhere : t.internetWhere;
        button.appendChild(where);
      });
      add('p', 'hint', t.hint);
    })();
  </script>
</body>
</html>
