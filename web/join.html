<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a PokerFection table</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <!--
    The invite link's page: join.html?code=K7M2Q&server=192.168.1.20:47474&server=peer:K7M2Q
    (the same query as the app's own pokerfection://join link). It offers
    the app, and playing in this browser: with a peer:CODE entry (the room
    through the meeting service), this site itself at the room
    (./?code=K7M2Q&server=peer:K7M2Q), which connects straight to the host's
    device. When the host serves its own web version too (web=1 in the
    link), the host's addresses follow as more ways to play in the browser
    over http: on the same Wi-Fi they need no internet, nor the meeting
    service, nor direct connections in the browser. An invite without a
    peer: entry (an older app) can't be played from this secure site
    (browsers block plain ws:// connections), so it links only to the
    host's own web version, on the same Wi-Fi or from elsewhere. It loads
    instantly (no Flutter), in English, Spanish or Chinese.
  -->
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0F12;
      color: #E8F0EA;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: min(420px, calc(100% - 32px)); text-align: center; padding: 24px 0; }
    h1 { font-size: 20px; font-weight: 600; margin: 0; }
    .code { font-size: 44px; font-weight: 800; letter-spacing: 8px; margin: 8px 0 20px; }
    a.button {
      display: block;
      padding: 14px 16px;
      margin: 10px 0;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
    }
    a.app { background: #2E8B57; color: #FFFFFF; }
    a.web { background: #16211B; color: #E8F0EA; border: 1px solid #2E8B57; }
    .small { display: block; font-weight: 400; font-size: 13px; color: #9DB0A4; margin-top: 2px; }
    .hint { color: #9DB0A4; font-size: 13px; line-height: 1.5; margin-top: 18px; }
    a.plain { color: #81C784; }
  </style>
</head>
<body>
  <main id="page"></main>
  <script>
    (function () {
      var text = {
        en: {
          title: 'Join the table',
          app: 'Open in the PokerFection app',
          wifi: 'Play in this browser',
          wifiWhere: 'On the same Wi-Fi as the host',
          internet: 'Play in this browser',
          internetWhere: 'From anywhere else',
          here: 'Play in this browser',
          hereWhere: 'No app needed',
          hint: 'Have the app? Open it from the first button, or type the room code in Play > Multiplayer. ' +
            'No app? Play in this browser.',
          hintOld: 'Have the app? Open it from the first button, or type the room code in Play > Multiplayer. ' +
            'In a browser, pick where you are: on the same Wi-Fi as the host, or anywhere else.',
          none: 'There is no room in this link.',
          game: 'Go to PokerFection'
        },
        es: {
          title: 'Únete a la mesa',
          app: 'Abrir en la app PokerFection',
          wifi: 'Jugar en este navegador',
          wifiWhere: 'En el mismo Wi-Fi que el anfitrión',
          internet: 'Jugar en este navegador',
          internetWhere: 'Desde cualquier otro lugar',
          here: 'Jugar en este navegador',
          hereWhere: 'Sin instalar nada',
          hint: '¿Tienes la app? Ábrela con el primer botón, o escribe el código de sala en Jugar > Multijugador. ' +
            '¿Sin app? Juega en este navegador.',
          hintOld: '¿Tienes la app? Ábrela con el primer botón, o escribe el código de sala en Jugar > Multijugador. ' +
            'En un navegador, elige dónde estás: en el mismo Wi-Fi que el anfitrión o en otro lugar.',
          none: 'Este enlace no tiene sala.',
          game: 'Ir a PokerFection'
        },
        zh: {
          title: '加入牌桌',
          app: '在 PokerFection 应用中打开',
          wifi: '在此浏览器中玩',
          wifiWhere: '与房主在同一个 Wi-Fi',
          internet: '在此浏览器中玩',
          internetWhere: '在其他任何地方',
          here: '在此浏览器中玩',
          hereWhere: '无需安装应用',
          hint: '有应用？用第一个按钮打开，或在 开始 > 多人 中输入房间号。没有应用？在此浏览器中玩。',
          hintOld: '有应用？用第一个按钮打开，或在 开始 > 多人 中输入房间号。在浏览器中，请按你所在的位置选择：与房主同一个 Wi-Fi，或其他地方。',
          none: '这个链接里没有房间。',
          game: '前往 PokerFection'
        }
      };
      var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
      var t = text[lang] || text.en;
      document.documentElement.lang = text[lang] ? lang : 'en';
      var page = document.getElementById('page');

      function add(tag, className, content, href) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (content) node.textContent = content;
        if (href) node.href = href;
        page.appendChild(node);
        return node;
      }

      var params = new URLSearchParams(location.search);
      var code = (params.get('code') || '').trim().toUpperCase();
      if (!/^[A-HJKMNP-Z2-9]{5}$/.test(code)) {
        add('p', 'hint', t.none);
        add('a', 'plain', t.game, './');
        return;
      }

      // The host's game servers, as the app's link writes them: "address:port"
      // (or a whole ws:// address). Its web version answers at the same place.
      function server(value) {
        try {
          var url = new URL(value.indexOf('://') < 0 ? 'ws://' + value + '/ws' : value);
          return url.protocol === 'ws:' && url.hostname ? { host: url.hostname, port: url.port || '80' } : null;
        } catch (e) {
          return null;
        }
      }
      function local(host) {
        return /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|169\.254\.)/.test(host);
      }

      function button(label, small, href) {
        var node = add('a', 'button web', label, href);
        var where = document.createElement('span');
        where.className = 'small';
        where.textContent = small;
        node.appendChild(where);
      }

      add('h1', null, t.title);
      add('div', 'code', code);
      add('a', 'button app', t.app, 'pokerfection://join' + location.search);
      // The room through the meeting service ("peer:" and the code, in any
      // case): this site plays it, from anywhere. So it does with just a
      // code (the site looks for it there too).
      var servers = params.getAll('server');
      var peer = servers.some(function (value) {
        return value.trim().toUpperCase() === 'PEER:' + code;
      });
      // The host's own web version, at each of its addresses: the only way
      // in a browser for an older app's invite; after this site, for a host
      // that says it serves one.
      function hostPages() {
        servers.filter(function (value) {
          return value.trim().toUpperCase().indexOf('PEER:') !== 0;
        }).map(server).filter(Boolean).forEach(function (s) {
          var near = local(s.host);
          button(near ? t.wifi : t.internet, near ? t.wifiWhere : t.internetWhere,
            'http://' + s.host + ':' + s.port + '/?code=' + code);
        });
      }
      if (peer || servers.length === 0) {
        button(t.here, t.hereWhere,
          './?code=' + code + (peer ? '&server=' + encodeURIComponent('peer:' + code) : ''));
        if (params.get('web') === '1') hostPages();
        add('p', 'hint', t.hint);
        return;
      }
      hostPages();
      add('p', 'hint', t.hintOld);
    })();
  </script>
</body>
</html>
