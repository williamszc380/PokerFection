<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Practice poker decisions against bots.">
  <meta name="theme-color" content="#0B0F12">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PokerFection">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PokerFection</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The page's color is on html alone: a body background would hide #loading. */
    html { background: #0B0F12; }
    body { margin: 0; height: 100%; }
    /* Shown while the app loads; behind the app once it draws. */
    #loading { position: fixed; inset: 0; z-index: -1; display: flex; align-items: center; justify-content: center; }
    #loading div {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid rgba(255, 193, 7, 0.2); border-top-color: #FFC107;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div></div></div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
